name: Android prototype
on: [push, pull_request, workflow_dispatch]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Protocol tests, debug APK and Android lint
        run: ./gradlew :hart-core:test :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hart-bro-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            hart-core/build/test-results/test/
            app/build/reports/lint-results-debug.*

  android-lifecycle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for API 36
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          du -sh /usr/share/dotnet /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          # Unused toolchains on this disposable Android-only runner; keep Java, Gradle and Android SDK.
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Diagnose space before installing API 36 image
        run: |
          avd_parent="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$avd_parent"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$ANDROID_HOME" "$avd_parent"
          python3 - <<'PYSPACE'
          import os, shutil
          path = os.environ.get('ANDROID_AVD_HOME', os.path.expanduser('~/.android/avd'))
          free = shutil.disk_usage(path).free
          minimum = 10 * 1024**3  # Image download/unpack, 2 GiB userdata, Gradle outputs and margin.
          print(f'AVD filesystem: {free / 1024**3:.2f} GiB free; required headroom: {minimum / 1024**3:.0f} GiB')
          assert free >= minimum, 'Runner has insufficient disk headroom for Android API 36'
          PYSPACE
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          avd-name: hartbro-api36
          disk-size: 2048M
          ram-size: 2048M
          heap-size: 256M
          pre-emulator-launch-script: |
            df -h "${ANDROID_AVD_HOME:-$HOME/.android/avd}"
            du -sh "${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-regression.sh
      - name: Verify Android regression results
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          counts = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          names = set()
          def annotation(level, text):
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{level} title=Android regression::{text}')
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              for suite in suites:
                  for key in counts:
                      counts[key] += int(suite.get(key, '0'))
                  for case in suite.iter('testcase'):
                      names.add(case.get('name'))
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          annotation('error', (case.get('name', '') + ': ' + (failure.text or failure.get('message', '')))[:5000])
          expected = {'homeScreenLockAndActivityRecreationKeepOneForegroundSession', 'archiveBackRemainsVisibleAfterScrollingAndSystemBackReturnsToList', 'explicitSessionStartPauseSaveFinishAndNewDeviceReuseBluetooth', 'initialIdentificationFailureWhileActivityIsBackgroundedDoesNotCreateSession', 'temporaryHartAndBluetoothLossRecoverWithoutDuplicateSessions', 'serviceDestructionKeepsTemporaryHistoryUntilExplicitUserDecision', 'pdfSingleVariableWithCyrillicMetadataRendersA4', 'pdfDifferentUnitsAndRealGapsRenderA4WithoutInventedSamples', 'longSessionPdfAndCsvKeepAllSourceMeasurements', 'initialConnectionWhileActivityIsBackgroundedRemainsReadyWithoutSession', 'journalRenameCommentSearchComparisonAndConfirmedMultiDelete', 'realControlExcelHas68TimestampRowsAnd269NumericValues', 'realControlPdfGroupsAllSectionsIntoTablesWithReadableGraphAndNoInventedFactoryData'}
          expected |= {'walkAWaitBReturnHomeAndRecreateKeepOneConnectionAndManualPassport', 'walkCanStartWithoutSensorAndRecoversBluetoothForAnyNextSensor', 'stoppedWalkKeepsDraftAndNewControllerRestoresItWithoutHiddenServiceRestart'}
          expected |= {'confirmedWriteSurvivesHomeScreenLockAndRecreateWithoutRepeatAndResumesSameSession', 'timeoutAndRestoredPendingJournalUseOnlyVerificationReads', 'walkLocalRangeEditNeverWritesAndExplicitConfigurationKeepsTheBook', 'unknownReadbackPausesPollingAndDeviceReplacementCannotReceivePreparedWrite', 'walkEndAndMonitorTransitionDialogsKeepAllThreeActionsOnSmallLargeFontScreen'}
          passed = counts['tests'] >= 21 and expected.issubset(names) and all(counts[key] == 0 for key in ('failures', 'errors', 'skipped'))
          annotation('notice' if passed else 'error', str(counts))
          if not counts['tests']:
              try:
                  text = open('/tmp/android-regression-gradle.log').read()
                  annotation('error', text[-5000:])
              except FileNotFoundError:
                  annotation('error', 'Android runner produced no JUnit results or Gradle log')
          assert passed, counts
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lifecycle-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/outputs/export-review/
