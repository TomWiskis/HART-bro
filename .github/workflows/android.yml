name: HART checks
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'affected = selected changes; full = all fast; soak = all with 3 × 5 min background'
        type: choice
        options: [full, affected, soak]
        default: full
      base:
        description: 'Optional comparison commit for manual affected mode; absent/unavailable = all fast checks'
        type: string
        required: false
permissions:
  contents: read
  actions: read
  pull-requests: read
# Cancel stale commits, but a duplicate push planning job must not cancel its PR validation.
concurrency:
  group: hart-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.build }}
      android: ${{ steps.select.outputs.android }}
      sdk: ${{ steps.select.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Verify test routing, native result parser and failure gates
        run: python3 -m unittest discover -s tools/tests -v
      - name: Select checks from a verified base
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/resolve-test-plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: test-plan
          path: test-plan.json
          retention-days: 30

  build-and-test:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-plan
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        if: needs.plan.outputs.sdk == 'true'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the required SDK only for Android tasks
        if: needs.plan.outputs.sdk == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Selected JVM contracts, APKs once and lint
        run: python3 .github/scripts/build-selected.py test-plan.json
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.android == 'true'
        with:
          name: ci-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-and-lint-results
          path: |
            hart-core/build/test-results/test/
            transport-usb/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 30

  android-regression:
    needs: [plan, build-and-test]
    if: needs.plan.outputs.android == 'true' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-plan
      - uses: actions/download-artifact@v4
        with:
          name: ci-apks
          path: ci-apks
      - name: Free space before creating the emulator
        run: |
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          python3 - <<'PY'
          import shutil
          assert shutil.disk_usage('.').free >= 10 * 1024**3, 'Insufficient disk space for the AVD'
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          avd-name: hartbro-api36
          disk-size: 2048M
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-regression.sh
      - name: Verify exact selected coverage and profile
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from tools.android_instrumentation import verify_result
          plan=json.loads(Path('test-plan.json').read_text())
          result=json.loads(Path('app/build/outputs/androidTest-results/selected/result.json').read_text())
          counts=verify_result(plan,result,require_soak=os.environ["GITHUB_REF"].startswith("refs/tags/"))
          print('Verified Android selection:',counts,'profile='+result['profile'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            test-plan.json
            app/build/outputs/androidTest-results/
            app/build/outputs/export-review/
          retention-days: 30
